name: Windows portable compile test
on:
  push:
    branches: [windows-portable-test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-portable-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build tools
        shell: pwsh
        run: |
          python -m pip install "cmake>=4,<5"
          rustup default stable
          cmake --version
          ninja --version
          cargo --version
          if (-not (Test-Path "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake")) { throw "vcpkg missing" }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Compile native x64 release
        shell: cmd
        working-directory: server
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          cmake --preset standalone-release-win64
          if errorlevel 1 exit /b 1
          cmake --build --preset standalone-release-win64 --parallel 2
          if errorlevel 1 exit /b 1
      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem server/out/build/standalone-release-win64 -Filter gimuserverw.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Executable missing" }
          Get-FileHash $exe.FullName -Algorithm SHA256
